name: Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e ".[dev,build,ml]"

      - name: Test
        run: python -m pytest

      - name: Build EXE
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows_exe.ps1 -Clean

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: AttentionOS-windows-exe
          path: dist/AttentionOS.exe
