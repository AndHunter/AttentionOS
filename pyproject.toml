[project]
name = "attentionos"
version = "0.1.0"
description = "Local-first personal performance modeling system for Windows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "serge" }]

dependencies = [
    "pywin32>=306",
    "psutil>=5.9",
    "sqlmodel>=0.0.22",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "streamlit>=1.37",
    "plotly>=5.22",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
build = [
    "pyinstaller>=6.10",
]
ml = [
    "scikit-learn>=1.5",
    "catboost>=1.2",
    "shap>=0.45",
]

[project.scripts]
attentionos = "attentionos.desktop.app:main"
attentionos-desktop = "attentionos.desktop.app:main"
attentionos-collect = "attentionos.collector.engine:main"
attentionos-ui = "attentionos.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attentionos"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/attentionos/models/trainer.py" = ["N803", "N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
